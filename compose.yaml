name: faxdock-mcp

services:
  faxdock:
    build: .
    environment:
      TELNYX_FAX_FROM: ${TELNYX_FAX_FROM:?Set your Telnyx fax number in .env}
      TELNYX_FAX_CONNECTION_ID: ${TELNYX_FAX_CONNECTION_ID:?Set your Telnyx Fax API application ID in .env}
    user: "${FAX_UID:-1000}:${FAX_GID:-1000}"
    volumes:
      - type: bind
        source: ./outbox
        target: /outbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./inbox
        target: /inbox
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
