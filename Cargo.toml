[package]
name = "telnyx-fax"
version = "0.1.0"
edition = "2024"
publish = false
description = "Self-hosted Telnyx faxing for MCP clients"
license = "MIT"
repository = "https://github.com/gwellington/faxdock-mcp"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
ring = "0.17"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
